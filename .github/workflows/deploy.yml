
name: Deploy Freelancing Websites

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      
      - name: Prepare websites
        run: |
          mkdir -p _site/Casa-Green-Indoor-Artificial-Gardening
          mkdir -p _site/Casa-Greens-Indoor-Gardening

          cp -a Brew-and-Bite/. _site/
          cp -a Casa-Green-Indoor-Artificial-Gardening/. _site/Casa-Green-Indoor-Artificial-Gardening/
          cp -a Casa-Greens-Indoor-Gardening/. _site/Casa-Greens-Indoor-Gardening/


      - name: Upload websites
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy websites
        id: deployment
        uses: actions/deploy-pages@v4
